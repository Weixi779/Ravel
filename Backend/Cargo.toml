[package]
name = "ravel-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
jj-lib = { version = "=0.41.0", default-features = false, features = ["git"] }
jj-cli = { version = "=0.41.0", default-features = false, features = ["git"] }
uniffi = "=0.32.0"
thiserror = "2"
futures = "0.3"
pollster = "0.4"
chrono = "0.4"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
# Keep host proc-macro dylib metadata aligned for the macOS 27 loader.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"
